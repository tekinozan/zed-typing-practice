name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-language-server:
    name: Publish language server to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Verify tag and package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          }

      - name: Publish package once
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "zed-typing-lsp@${version}" version >/dev/null 2>&1; then
            echo "zed-typing-lsp@${version} is already published"
          else
            npm publish --access public
          fi

      - name: Probe trusted publishing without releasing
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set +e
          output=$(npm publish --access public 2>&1)
          status=$?
          echo "${output}"
          if [ "${status}" -eq 0 ]; then
            echo "::error::Probe published a release; it should only ever hit an existing version"
            exit 1
          fi
          if grep -qiE "cannot publish over|previously published version" <<<"${output}"; then
            echo "::notice::Trusted publishing works: npm authenticated the OIDC token and rejected the duplicate version"
            exit 0
          fi
          echo "::error::Trusted publishing is not usable from this workflow; see the npm error above"
          exit 1

  update-zed-registry:
    name: Update existing Zed registry entry
    needs: publish-language-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether the extension is already registered
        id: registry
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/zed-industries/extensions/main/extensions.toml \
            --output "${RUNNER_TEMP}/extensions.toml"
          if grep -q '^\[typing-practice\]$' "${RUNNER_TEMP}/extensions.toml"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::The first registry submission is manual; automatic updates start after it is merged."
          fi


      - name: Submit extension update
        if: steps.registry.outputs.exists == 'true'
        uses: huacnlee/zed-extension-action@82920ff0876879f65ffbcfa3403589114a8919c6
        with:
          extension-name: typing-practice
          push-to: tekinozan/extensions
          tag: ${{ github.ref_name }}
          create-pullrequest: true
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_REGISTRY_TOKEN }}
